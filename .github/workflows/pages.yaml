name: Pages

on:
  push:
    branches: [master]
  pull_request:
  repository_dispatch:
    types: [static-bundle-published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Verify Pages artifact staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Validate shell scripts and preservation of the homepage
        run: |
          for script in tool/*.sh; do bash -n "$script"; done
          bash tool/test_prepare_pages.sh
          bash tool/test_select_bundles.sh

  deploy:
    name: Deploy homepage and latest primary and preview bundles
    needs: checks
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: github-pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - name: Stage the homepage and latest published Web builds
        env:
          GH_TOKEN: ${{ github.token }}
          STATIC_BUNDLE_ENABLED: ${{ vars.STATIC_BUNDLE_ENABLED || 'true' }}
        run: |
          case "$STATIC_BUNDLE_ENABLED" in
            true|false) ;;
            *) echo 'STATIC_BUNDLE_ENABLED must be true or false.' >&2; exit 1 ;;
          esac
          archive_paths=(- -)
          selection='{"production":"","staging":""}'
          if [[ "$STATIC_BUNDLE_ENABLED" == true ]]; then
            selection=$(gh api --paginate --slurp \
              "repos/$GITHUB_REPOSITORY/releases?per_page=100" | \
              jq -c -f tool/select_bundles.jq)
            channels=(production staging)
            for index in 0 1; do
              channel=${channels[$index]}
              release_tag=$(jq -r --arg channel "$channel" '.[$channel]' <<< "$selection")
              if [[ -n "$release_tag" ]]; then
                download_path="$RUNNER_TEMP/bundle-download/$channel"
                gh release download "$release_tag" --repo "$GITHUB_REPOSITORY" \
                  --pattern web-bundle.tar.gz --dir "$download_path"
                archive_paths[$index]="$download_path/web-bundle.tar.gz"
              fi
            done
          fi
          bash tool/prepare_pages.sh "${archive_paths[0]}" "$RUNNER_TEMP/pages" "${archive_paths[1]}"
          jq -r '"Primary bundle: \(.production)\nPreview bundle: \(.staging)"' <<< "$selection" >> "$GITHUB_STEP_SUMMARY"
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - name: Upload the complete website
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages/
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
